name: Validate architecture and content

# Validarea completă este intenționat manuală. Branch-ul de dezvoltare poate avea
# multe iterații, iar rularea la fiecare commit ar consuma inutil GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate stability, content, compile and core tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build web release
        run: npm run build:web
      - name: Regenerate documentation and previews
        run: npm run generate:catalog && npm run preview
      - name: Verify committed generated artifacts
        run: git diff --exit-code -- content/curriculum-map.json content/level-ladders.json docs/03-game-catalog.md examples/generated-levels.json
